name: C/C++ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up GCC Compiler
      run: sudo apt-get update && sudo apt-get install -y gcc make

    - name: Compile and Run Unit Tests
      run: |
        gcc -Wall -Wextra -Werror -Iinclude src/ring_buffer.c tests/test_main.c -o test_runner
        ./test_runner
